# Generated by Proto Lake. Edit freely — Proto Lake will not overwrite it on rebuild.
#
# Single workflow that handles both release-please's Release-PR maintenance and
# the artifact publish, gated on `releases_created` and matrix-fanned-out by
# `paths_released`.
#
# Why one workflow instead of `on: push: tags`: tags created by the default
# GITHUB_TOKEN do NOT trigger downstream workflows
# (https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow),
# so a separate tag-triggered publish workflow would silently never fire.
#
# Configure repository variables (Settings → Secrets and variables → Actions):
#   GCP_PROJECT_ID, GCP_REGION  — for AR URLs
#   WIF_PROVIDER, CI_SERVICE_ACCOUNT — for workload identity federation
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  PROTOLAKE_IMAGE: ghcr.io/cohub-space/protolake:latest

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released:   ${{ steps.release.outputs.paths_released }}
      drafts:           ${{ steps.drafts.outputs.prs }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # A release PR stays a draft until its branch carries the regenerated
      # files (regenerate-release-branch below), and GitHub refuses to merge
      # a draft. release-please pushes a new version bump onto an open
      # release PR without drafting it, so every ready one is held first,
      # with its head recorded. Both lists in this job read every open PR
      # and keep the release PRs in jq: given a label filter, gh answers
      # from the search index, which shows a PR, its label and its draft
      # state only a moment after they change; the plain list reads them as
      # they are, as release-please does. gh lists 30 PRs by default, newest
      # first, hence the limit.
      - name: Hold the open release PRs as drafts
        id: hold
        run: |
          held=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 1000 \
            --json number,isDraft,headRefOid,labels \
            --jq '[.[] | select(any(.labels[]; .name == "autorelease: pending") and (.isDraft | not))
              | "\(.number):\(.headRefOid)"] | join(" ")')
          for entry in $held; do
            gh pr ready --undo "$(echo "$entry" | cut -d: -f1)" -R "$GITHUB_REPOSITORY"
          done
          echo "held=$held" >> "$GITHUB_OUTPUT"

      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A held PR whose head release-please did not move still carries its
      # regenerated tree. This runs when release-please failed too: a PR it
      # moved stays a draft either way.
      - name: Ready the held release PRs release-please left alone
        if: always() && steps.hold.outputs.held != ''
        env:
          HELD: ${{ steps.hold.outputs.held }}
        run: |
          for entry in $HELD; do
            pr=$(echo "$entry" | cut -d: -f1)
            head=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json state,headRefOid \
              --jq 'select(.state == "OPEN") | .headRefOid')
            if [ "$head" = "$(echo "$entry" | cut -d: -f2)" ]; then
              gh pr ready "$pr" -R "$GITHUB_REPOSITORY"
            fi
          done

      # The release PRs whose branch needs regenerating: each one
      # release-please opened or moved in this run, read from its own
      # outputs, and every other open release PR that is a draft (one an
      # earlier failed run left held), from the list. The outputs name
      # exactly the PRs whose branch release-please rewrote, whatever a
      # list reads; a reported PR they cannot name fails the step instead
      # of leaving the regenerate matrix empty.
      - name: List the release PRs to regenerate
        id: drafts
        env:
          REPORTED: ${{ steps.release.outputs.prs }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
        run: |
          [ -n "$REPORTED" ] || REPORTED='[]'
          reported=$(printf '%s' "$REPORTED" | jq -c '
            map(with_entries(select(.key == "number" or .key == "headBranchName")
              | if .key == "headBranchName" then .key = "headRefName" else . end))
            | if any(.[]; (.number | type) != "number" or (.headRefName | type) != "string")
              then error("release-please reported a release PR without its number or head branch")
              else . end')
          if [ "$PRS_CREATED" = true ] && [ "$reported" = '[]' ]; then
            echo "::error::release-please reported a release PR, but its prs output names none"
            exit 1
          fi
          listed=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 1000 \
            --json number,isDraft,headRefName,labels \
            --jq '[.[] | select(.isDraft and any(.labels[]; .name == "autorelease: pending"))
              | del(.isDraft, .labels)] | tojson')
          prs=$(printf '%s\n%s' "$reported" "$listed" | jq -cs 'add | unique_by(.number)')
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  # Gazelle bakes each bundle's version into its BUILD files from bundle.yaml
  # (rules_jvm_external needs the maven coordinates at analysis time), and
  # release-please's bump edits only bundle.yaml — so the committed BUILD files
  # go stale on every release and the pom generator's version guard fails the
  # next build. This job regenerates them on each release branch, with the
  # same build the PR check runs, so the release merge lands both and main
  # never drifts. It runs for every open release PR the release-please job
  # leaves a draft (one per bundle under separate-pull-requests). The commit
  # carries every file the build regenerates (the workspace initializer
  # rewrites the wrapper, MODULE.bazel, the npm workspace and tools/ from the
  # image's templates before gazelle runs), never half of them, so the branch
  # is exactly the tree the build just verified. GITHUB_TOKEN pushes trigger
  # no workflow, so it cannot loop. A red run here leaves the release PR a
  # draft, and the next run of this workflow regenerates it again: re-run the
  # workflow, or push a commit. The release PR stays a draft until its branch
  # is regenerated, and GitHub refuses to merge a draft: a
  # merge during the build would leave main with the previous coordinates.
  # release-please opens it as a draft (draft-pull-request in
  # release-please-config.json), the release-please job holds a ready one
  # before release-please can move it, and this job marks it ready only once
  # the regenerated tree is on the branch.
  regenerate-release-branch:
    name: regenerate ${{ matrix.pr.headRefName }}
    needs: release-please
    if: needs.release-please.outputs.drafts != '' && needs.release-please.outputs.drafts != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.release-please.outputs.drafts) }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      RELEASE_BRANCH: ${{ matrix.pr.headRefName }}
      RELEASE_PR: ${{ matrix.pr.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}

      # The remote cache is speed, not correctness: a lake without workload
      # identity builds cold and skips the ci config that needs it.
      - if: vars.WIF_PROVIDER != ''
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - if: vars.WIF_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Regenerate the lake against the bumped bundle versions
        run: |
          PROTOLAKE_IMAGE="${{ env.PROTOLAKE_IMAGE }}" \
          PROTOLAKE_BAZEL_CONFIG="${{ vars.WIF_PROVIDER != '' && 'ci' || '' }}" \
            ./protolakew --pull always build

      # Only what the build regenerates: buf.yaml, buf.gen.yaml and .bazelrc
      # are written once at init and user-owned afterwards; package.json and
      # pnpm-lock.yaml are rewritten as a pair.
      - name: Commit the regenerated files to the release branch
        run: |
          BASE="$(git rev-parse HEAD)"
          git add -- ':(glob)**/BUILD.bazel' .bazelrc.remote-cache MODULE.bazel \
            package.json pnpm-lock.yaml protolakew tools
          if git diff --cached --quiet; then
            echo "generated files already match bundle.yaml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate the lake's generated files for the release versions"
          # The lease pins the branch to the sha this job checked out: a
          # release PR merged (branch deleted) or force-updated by
          # release-please during the build makes the push fail loudly
          # instead of resurrecting or overwriting the branch.
          git push --force-with-lease="refs/heads/${RELEASE_BRANCH}:${BASE}" \
            origin "HEAD:${RELEASE_BRANCH}"

      - name: Mark the release PR ready
        run: gh pr ready "$RELEASE_PR" -R "$GITHUB_REPOSITORY"

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        bundle-path: ${{ fromJson(needs.release-please.outputs.paths_released) }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Publish bundle
        run: |
          AR_TOKEN="$(gcloud auth print-access-token)"
          PROTOLAKE_IMAGE="${{ env.PROTOLAKE_IMAGE }}" \
          PROTOLAKE_BAZEL_CONFIG=ci \
          MAVEN_REPO="https://${{ vars.GCP_REGION }}-maven.pkg.dev/${{ vars.GCP_PROJECT_ID }}/maven-internal" \
          PYPI_REPO="https://${{ vars.GCP_REGION }}-python.pkg.dev/${{ vars.GCP_PROJECT_ID }}/python-internal/" \
          REGISTRY_TOKEN="${AR_TOKEN}" \
          NPM_PUBLISH_MODE="registry" \
          NPM_REGISTRY_URL="https://${{ vars.GCP_REGION }}-npm.pkg.dev/${{ vars.GCP_PROJECT_ID }}/npm-internal/" \
          NPM_REGISTRY_TOKEN="${AR_TOKEN}" \
            ./protolakew --pull always publish --bundle "${{ matrix.bundle-path }}"
