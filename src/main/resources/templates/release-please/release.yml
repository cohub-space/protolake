# Generated by Proto Lake. Edit freely — Proto Lake will not overwrite it on rebuild.
#
# Single workflow that handles both release-please's Release-PR maintenance and
# the artifact publish, gated on `releases_created` and matrix-fanned-out by
# `paths_released`.
#
# Why one workflow instead of `on: push: tags`: tags created by the default
# GITHUB_TOKEN do NOT trigger downstream workflows
# (https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow),
# so a separate tag-triggered publish workflow would silently never fire.
#
# Configure repository variables (Settings → Secrets and variables → Actions):
#   GCP_PROJECT_ID, GCP_REGION  — for AR URLs
#   WIF_PROVIDER, CI_SERVICE_ACCOUNT — for workload identity federation
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  PROTOLAKE_IMAGE: ghcr.io/cohub-space/protolake:latest

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released:   ${{ steps.release.outputs.paths_released }}
      drafts:           ${{ steps.drafts.outputs.prs }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Whether a commit is the regenerate job's: its message carries the
      # Regenerated-by trailer that job adds, which release-please's never do.
      REGENERATED_HEAD: '.commit.message | split("\n") | any(. == "Regenerated-by: release-workflow")'
    # An unspecified shell runs bash -e without pipefail, so a command that
    # failed inside a pipeline would pass on an empty list.
    defaults:
      run:
        shell: bash
    steps:
      # A release PR may merge only once its branch carries the regenerated
      # files (regenerate-release-branch below), and GitHub refuses to merge
      # a draft. Whether a branch carries them is read from its tip on every
      # run, never remembered: the regenerate job's commit is the tip of a
      # regenerated branch, and release-please rewrites the branch without
      # one. The tip is read from the branch itself: GitHub updates the PR's
      # recorded head a moment after a push. release-please pushes onto an
      # open release PR without drafting it, so every ready one is held
      # first. Both lookups in this job page through every open PR with the
      # REST API and keep the release PRs in jq, the way release-please finds
      # them: given a label filter, gh answers from the search index, which
      # shows a PR, its label and its draft state only a moment after they
      # change, and gh pr list stops at a limit. Both keep only PRs whose
      # branch lives in this repository: a fork PR labelled as a release PR
      # would send its branch name to checkout and push.
      - name: Hold the open release PRs as drafts
        id: hold
        run: |
          held=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY)
              | select(any(.labels[]; .name == "autorelease: pending") and (.draft | not))
              | .number' | paste -sd ' ' -)
          for pr in $held; do
            gh pr ready --undo "$pr" -R "$GITHUB_REPOSITORY"
          done
          echo "held=$held" >> "$GITHUB_OUTPUT"

      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A held PR goes back to ready only if its branch tip is still the
      # regenerate job's commit; release-please moved any other. One
      # release-please reported in this run stays a draft whatever its tip
      # reads, since that read can lag release-please's push: the next step
      # regenerates it, and until then it cannot be merged, even if that
      # step fails. REPORTED_NUMBERS is the next step's expression, so both
      # steps take the same PRs as reported. This runs when release-please
      # failed too. A PR this step cannot read stays a draft, and the next
      # step reads it again.
      - name: Ready the held release PRs that are regenerated
        if: always() && steps.hold.outputs.held != ''
        env:
          HELD: ${{ steps.hold.outputs.held }}
          REPORTED_NUMBERS: ${{ toJSON(fromJSON(steps.release.outputs.prs || '[]').*.number) }}
        run: |
          for pr in $HELD; do
            if printf '%s' "$REPORTED_NUMBERS" | jq -e --argjson n "$pr" 'any(.[]; . == $n)' > /dev/null; then
              continue
            fi
            if ! branch=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq 'select(.state == "open") | .head.ref'); then
              echo "::warning::could not read #$pr; it stays a draft"
              continue
            fi
            [ -n "$branch" ] || continue
            if ! regenerated=$(gh api "repos/$GITHUB_REPOSITORY/commits/heads/$branch" --jq "$REGENERATED_HEAD"); then
              echo "::warning::could not read the branch of #$pr; it stays a draft"
              continue
            fi
            if [ "$regenerated" = true ] && ! gh pr ready "$pr" -R "$GITHUB_REPOSITORY"; then
              echo "::warning::could not mark #$pr ready; the next step tries again"
            fi
          done

      # Every open release PR: one release-please opened or moved in this run
      # needs regenerating outright, and any other is judged by its branch
      # tip. A regenerated one is ready; any other goes back to draft and
      # into the regenerate matrix. release-please's report also finds a PR
      # the scan missed. The step acts on every PR it could
      # read before it fails for one it could not, and the next run reads
      # that one again. Only each reported PR's number and head branch reach
      # the environment: the output also carries every PR's body, and Linux
      # will not start a process with an environment variable over 128 KiB.
      - name: List the release PRs to regenerate
        id: drafts
        env:
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          REPORTED_NUMBERS: ${{ toJSON(fromJSON(steps.release.outputs.prs || '[]').*.number) }}
          REPORTED_BRANCHES: ${{ toJSON(fromJSON(steps.release.outputs.prs || '[]').*.headBranchName) }}
        run: |
          failed=false
          # The .* filter skips a PR that lacks the field; transpose pads the
          # shorter list with null, which the check below rejects.
          if ! reported=$(printf '%s\n%s' "$REPORTED_NUMBERS" "$REPORTED_BRANCHES" | jq -cs '
              transpose | map(. as [$number, $branch] | null | .number = $number | .headRefName = $branch)
              | if any(.[]; (.number | type) != "number" or .number <= 0
                  or (.headRefName | type) != "string" or .headRefName == "")
                then error("release-please reported a release PR without its number or head branch")
                else . end'); then
            echo "::error::release-please reported a release PR without its number or head branch"
            reported='[]'
            failed=true
          elif [ "$PRS_CREATED" = true ] && [ "$reported" = '[]' ]; then
            echo "::error::release-please reported a release PR, but its prs output names none"
            failed=true
          fi
          # Every open PR on a branch of this repository.
          open=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY)
              | .headRefName = .head.ref
              | .release = any(.labels[]; .name == "autorelease: pending")
              | with_entries(select(.key == "number" or .key == "headRefName" or .key == "draft"
                  or .key == "release"))' \
            | jq -cs '.')
          # A reported PR the scan missed is looked up directly: the scan
          # pages by page number, so a PR closed while it is read moves
          # another onto a page already read. Only an open PR on a branch of
          # this repository is kept: release-please matches its PR by branch
          # name alone, so it can report a fork PR whose branch has the
          # release branch's name.
          missing=$(printf '%s\n%s' "$reported" "$open" | jq -rs '
            .[1] as $open | .[0][] | .number as $n
            | select(any($open[]; .number == $n) | not) | $n')
          for pr in $missing; do
            if ! found=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" \
              --jq 'select(.state == "open" and .head.repo.full_name == env.GITHUB_REPOSITORY)
                | .headRefName = .head.ref
                | .release = any(.labels[]; .name == "autorelease: pending")
                | with_entries(select(.key == "number" or .key == "headRefName" or .key == "draft"
                    or .key == "release"))'); then
              echo "::error::could not look up #$pr, which release-please reported"
              failed=true
            elif [ -n "$found" ]; then
              open=$(printf '%s\n%s' "$open" "$found" | jq -cs '.[0] + [.[1]]')
            else
              echo "::warning::release-please reported #$pr, which is closed or on a fork's branch; it is not regenerated"
            fi
          done
          # The release PRs: labelled, or reported while the label is not
          # visible yet. unique_by: a PR opened while the pages are read
          # pushes another onto the next page, where it is listed twice.
          release=$(printf '%s\n%s' "$reported" "$open" | jq -cs '
            .[0] as $reported | .[1]
            | map(select(.number as $n | .release or any($reported[]; .number == $n)))
            | unique_by(.number)')
          numbers=$(printf '%s' "$release" | jq -r '.[].number')
          prs='[]'
          for pr in $numbers; do
            pull=$(printf '%s' "$release" | jq -c --argjson n "$pr" 'map(select(.number == $n)) | first')
            branch=$(printf '%s' "$pull" | jq -r '.headRefName')
            draft=$(printf '%s' "$pull" | jq -r '.draft')
            if printf '%s' "$reported" | jq -e --argjson n "$pr" 'any(.[]; .number == $n)' > /dev/null; then
              regenerated=false
            elif ! regenerated=$(gh api "repos/$GITHUB_REPOSITORY/commits/heads/$branch" --jq "$REGENERATED_HEAD"); then
              echo "::error::could not read the branch of #$pr; it is regenerated"
              failed=true
              regenerated=false
            fi
            if [ "$regenerated" = true ]; then
              if [ "$draft" = true ] && ! gh pr ready "$pr" -R "$GITHUB_REPOSITORY"; then
                echo "::error::could not mark #$pr ready"
                failed=true
              fi
            else
              if [ "$draft" = false ] && ! gh pr ready --undo "$pr" -R "$GITHUB_REPOSITORY"; then
                echo "::error::could not put #$pr back to draft"
                failed=true
              fi
              prs=$(printf '%s\n%s' "$prs" "$pull" | jq -cs '.[0] + [.[1] | del(.draft, .release)]')
            fi
          done
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          if [ "$failed" = true ]; then
            echo "::error::every release PR the step could read is handled; re-run the workflow for the rest"
            exit 1
          fi

  # Gazelle bakes each bundle's version into its BUILD files from bundle.yaml
  # (rules_jvm_external needs the maven coordinates at analysis time), and
  # release-please's bump edits only bundle.yaml — so the committed BUILD files
  # go stale on every release and the pom generator's version guard fails the
  # next build. This job regenerates them on each release branch, with the
  # same build the PR check runs, so the release merge lands both and main
  # never drifts. It runs for every open release PR whose head is not its
  # own commit (one per bundle under separate-pull-requests), and also when
  # the release-please job failed after listing them. The commit
  # carries every file the build regenerates (the workspace initializer
  # rewrites the wrapper, MODULE.bazel, the npm workspace and tools/ from the
  # image's templates before gazelle runs), never half of them, so the branch
  # is exactly the tree the build just verified. GITHUB_TOKEN pushes trigger
  # no workflow, so it cannot loop. A red run here leaves the release PR a
  # draft, and the next run of this workflow regenerates it again: re-run the
  # workflow, or push a commit. The release PR stays a draft until its branch
  # is regenerated, and GitHub refuses to merge a draft: a
  # merge during the build would leave main with the previous coordinates.
  # release-please opens it as a draft (draft-pull-request in
  # release-please-config.json), the release-please job holds a ready one
  # before release-please can move it, and this job marks it ready only once
  # the regenerated tree is on the branch.
  regenerate-release-branch:
    name: regenerate ${{ matrix.pr.headRefName }}
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.drafts != '' && needs.release-please.outputs.drafts != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.release-please.outputs.drafts) }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      RELEASE_BRANCH: ${{ matrix.pr.headRefName }}
      RELEASE_PR: ${{ matrix.pr.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}

      # The remote cache is speed, not correctness: a lake without workload
      # identity builds cold and skips the ci config that needs it.
      - if: vars.WIF_PROVIDER != ''
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - if: vars.WIF_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Regenerate the lake against the bumped bundle versions
        run: |
          PROTOLAKE_IMAGE="${{ env.PROTOLAKE_IMAGE }}" \
          PROTOLAKE_BAZEL_CONFIG="${{ vars.WIF_PROVIDER != '' && 'ci' || '' }}" \
            ./protolakew --pull always build

      # Only what the build regenerates: buf.yaml, buf.gen.yaml and .bazelrc
      # are written once at init and user-owned afterwards; package.json and
      # pnpm-lock.yaml are rewritten as a pair. The commit is made even when
      # nothing changed: its Regenerated-by trailer is how the release-please
      # job tells a regenerated branch from one release-please rewrote.
      - name: Commit the regenerated files to the release branch
        run: |
          BASE="$(git rev-parse HEAD)"
          git add -- ':(glob)**/BUILD.bazel' .bazelrc.remote-cache MODULE.bazel \
            package.json pnpm-lock.yaml protolakew tools
          if git diff --cached --quiet; then
            echo "generated files already match bundle.yaml"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: regenerate the lake's generated files for the release versions" \
            -m "Regenerated-by: release-workflow"
          # The lease pins the branch to the sha this job checked out: a
          # release PR merged (branch deleted) or force-updated by
          # release-please during the build makes the push fail loudly
          # instead of resurrecting or overwriting the branch.
          git push --force-with-lease="refs/heads/${RELEASE_BRANCH}:${BASE}" \
            origin "HEAD:${RELEASE_BRANCH}"

      - name: Mark the release PR ready
        run: gh pr ready "$RELEASE_PR" -R "$GITHUB_REPOSITORY"

  # Runs when the release-please job failed after release-please tagged a
  # release too: a re-run would find no new release to publish.
  publish:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        bundle-path: ${{ fromJson(needs.release-please.outputs.paths_released) }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Publish bundle
        run: |
          AR_TOKEN="$(gcloud auth print-access-token)"
          PROTOLAKE_IMAGE="${{ env.PROTOLAKE_IMAGE }}" \
          PROTOLAKE_BAZEL_CONFIG=ci \
          MAVEN_REPO="https://${{ vars.GCP_REGION }}-maven.pkg.dev/${{ vars.GCP_PROJECT_ID }}/maven-internal" \
          PYPI_REPO="https://${{ vars.GCP_REGION }}-python.pkg.dev/${{ vars.GCP_PROJECT_ID }}/python-internal/" \
          REGISTRY_TOKEN="${AR_TOKEN}" \
          NPM_PUBLISH_MODE="registry" \
          NPM_REGISTRY_URL="https://${{ vars.GCP_REGION }}-npm.pkg.dev/${{ vars.GCP_PROJECT_ID }}/npm-internal/" \
          NPM_REGISTRY_TOKEN="${AR_TOKEN}" \
            ./protolakew --pull always publish --bundle "${{ matrix.bundle-path }}"
