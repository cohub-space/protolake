# Generated by Proto Lake. Edit freely — Proto Lake will not overwrite it on rebuild.
#
# Single workflow that handles both release-please's Release-PR maintenance and
# the artifact publish, gated on `releases_created` and matrix-fanned-out by
# `paths_released`.
#
# Why one workflow instead of `on: push: tags`: tags created by the default
# GITHUB_TOKEN do NOT trigger downstream workflows
# (https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow),
# so a separate tag-triggered publish workflow would silently never fire.
#
# Configure repository variables (Settings → Secrets and variables → Actions):
#   GCP_PROJECT_ID, GCP_REGION  — for AR URLs
#   WIF_PROVIDER, CI_SERVICE_ACCOUNT — for workload identity federation
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  PROTOLAKE_IMAGE: ghcr.io/cohub-space/protolake:latest

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released:   ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Gazelle bakes each bundle's version into its BUILD files from bundle.yaml
  # (rules_jvm_external needs the maven coordinates at analysis time), and
  # release-please's bump edits only bundle.yaml — so the committed BUILD files
  # go stale on every release and the pom generator's version guard fails the
  # next build. This job regenerates them on the release branch, with the same
  # build the PR check runs, so the release merge lands both and main never
  # drifts. GITHUB_TOKEN pushes trigger no workflow, so it cannot loop.
  regenerate-release-branch:
    needs: release-please
    if: needs.release-please.outputs.releases_created != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_BRANCH: release-please--branches--main
    steps:
      - id: branch
        name: Find the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/${RELEASE_BRANCH}" --silent; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "no ${RELEASE_BRANCH} branch; nothing to regenerate"
          fi

      - if: steps.branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}

      - if: steps.branch.outputs.exists == 'true'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - if: steps.branch.outputs.exists == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - if: steps.branch.outputs.exists == 'true'
        name: Regenerate the BUILD files against the bumped bundle versions
        run: |
          PROTOLAKE_IMAGE="${{ env.PROTOLAKE_IMAGE }}" \
          PROTOLAKE_BAZEL_CONFIG=ci \
            ./protolakew --pull always build

      - if: steps.branch.outputs.exists == 'true'
        name: Commit the regenerated BUILD files to the release branch
        run: |
          git add -- ':(glob)**/BUILD.bazel'
          if git diff --cached --quiet; then
            echo "BUILD files already match bundle.yaml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate BUILD files for the release versions"
          git push origin "HEAD:${RELEASE_BRANCH}"

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bundle-path: ${{ fromJson(needs.release-please.outputs.paths_released) }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Publish bundle
        run: |
          AR_TOKEN="$(gcloud auth print-access-token)"
          PROTOLAKE_IMAGE="${{ env.PROTOLAKE_IMAGE }}" \
          PROTOLAKE_BAZEL_CONFIG=ci \
          MAVEN_REPO="https://${{ vars.GCP_REGION }}-maven.pkg.dev/${{ vars.GCP_PROJECT_ID }}/maven-internal" \
          PYPI_REPO="https://${{ vars.GCP_REGION }}-python.pkg.dev/${{ vars.GCP_PROJECT_ID }}/python-internal/" \
          REGISTRY_TOKEN="${AR_TOKEN}" \
          NPM_PUBLISH_MODE="registry" \
          NPM_REGISTRY_URL="https://${{ vars.GCP_REGION }}-npm.pkg.dev/${{ vars.GCP_PROJECT_ID }}/npm-internal/" \
          NPM_REGISTRY_TOKEN="${AR_TOKEN}" \
            ./protolakew --pull always publish --bundle "${{ matrix.bundle-path }}"
